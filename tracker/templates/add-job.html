<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Job | JobTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f3f4f6; }

        nav {
            background: #1e1b4b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo-icon {
            width: 32px;
            height: 32px;
            background: #818cf8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo-text {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .nav-back {
            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-back:hover { color: white; }

        .page {
            max-width: 680px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }

        .page-sub {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid #e5e7eb;
        }

        .field {
            margin-bottom: 1.5rem;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
            color: #111827;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .field textarea {
            resize: vertical;
            min-height: 100px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .status-option {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #f9fafb;
            color: #6b7280;
        }

        .status-option:hover {
            border-color: #4f46e5;
            color: #4f46e5;
        }

        .status-option.active {
            background: #eef2ff;
            border-color: #4f46e5;
            color: #4f46e5;
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #5b5fc7, #4d82e5);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(77, 130, 229, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #696dd9, #5da0f5);
            transform: translateY(-1px);
        }

        .success-msg {
            color: #10b981;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-logo">
        <div class="nav-logo-icon">
            <svg width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </div>
        <span class="nav-logo-text">JobTracker</span>
    </div>
    <a href="/dashboard/" class="nav-back">← Back to Dashboard</a>
</nav>

<div class="page">
    <p class="page-title">Add New Application</p>
    <p class="page-sub">Track a new job you've applied to</p>

    <div class="card">

        <div class="field">
            <label>Company Name</label>
            <input id="company" type="text" placeholder="e.g. Google, Amazon" />
        </div>

        <div class="field">
            <label>Job Title</label>
            <input id="title" type="text" placeholder="e.g. Backend Developer" />
        </div>

        <div class="field">
            <label>Status</label>
            <div class="status-grid">
                <div class="status-option active" onclick="selectStatus('Applied', this)">Applied</div>
                <div class="status-option" onclick="selectStatus('Interview', this)">Interview</div>
                <div class="status-option" onclick="selectStatus('Rejected', this)">Rejected</div>
                <div class="status-option" onclick="selectStatus('Hired', this)">Hired</div>
            </div>
            <input type="hidden" id="status" value="Applied" />
        </div>

        <div class="field">
            <label>Notes</label>
            <textarea id="notes" placeholder="Any additional notes..."></textarea>
        </div>

        <button class="btn-primary" onclick="addJob()">Add Application</button>
        <p class="success-msg" id="success-msg">✓ Job added successfully!</p>
    </div>
</div>

<script>
const token = localStorage.getItem('token')
if(!token) { window.location.href = '/' }

function selectStatus(value, el) {
    document.querySelectorAll('.status-option').forEach(opt => opt.classList.remove('active'))
    el.classList.add('active')
    document.getElementById('status').value = value
}

async function addJob() {
    const company = document.getElementById('company').value.trim()
    const title = document.getElementById('title').value.trim()
    const status = document.getElementById('status').value
    const notes = document.getElementById('notes').value

    if(!company || !title) {
        alert('Company name and job title are required!')
        return
    }

    const response = await fetch('/api/jobs/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
            company_name: company,
            job_title: title,
            status: status,
            notes: notes
        })
    })

    if(response.ok) {
        document.getElementById('success-msg').style.display = 'block'
        setTimeout(() => {
            window.location.href = '/dashboard/'
        }, 1500)
    } else {
        alert('Error adding job!')
    }
}
</script>

</body>
</html>
