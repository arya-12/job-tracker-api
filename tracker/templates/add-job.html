<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<nav class="bg-blue-600 p-4 flex justify-between items-center">
    <h1 class="text-white text-xl font-bold">Job Tracker</h1>
    <a href="/dashboard/" class="text-white">← Back</a>
</nav>

<div class="p-8 max-w-lg mx-auto">
    <h2 class="text-2xl font-bold mb-6">Add New Job</h2>

    <div class="bg-white p-6 rounded shadow">
        <input id="company" type="text" placeholder="Company Name"
            class="w-full border p-2 rounded mb-4">

        <input id="title" type="text" placeholder="Job Title"
            class="w-full border p-2 rounded mb-4">

        <select id="status" class="w-full border p-2 rounded mb-4">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Rejected">Rejected</option>
            <option value="Hired">Hired</option>
        </select>

        <textarea id="notes" placeholder="Notes"
            class="w-full border p-2 rounded mb-4" rows="3"></textarea>

        <button onclick="addJob()"
            class="w-full bg-blue-500 text-white p-2 rounded">
            Add Job
        </button>
    </div>
</div>

<script>
const token = localStorage.getItem('token')
if(!token) {
    window.location.href = '/'
}

async function addJob() {
    const company = document.getElementById('company').value
    const title = document.getElementById('title').value
    const status = document.getElementById('status').value
    const notes = document.getElementById('notes').value

    const response = await fetch('http://127.0.0.1:8000/api/jobs/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
            company_name: company,
            job_title: title,
            status: status,
            notes: notes
        })
    })

    if(response.ok) {
        alert('Job added!')
        window.location.href = '/dashboard/'
    } else {
        alert('Error adding job!')
    }
}
</script>

</body>
</html>
